[package]
name = "hyprkey"
version = "1.0.0"
edition = "2021"
description = "Lightweight Wayland layer-shell keystroke HUD for Hyprland"
license = "MIT"
readme = "README.md"
include = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
ab_glyph = "0.2"
evdev = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.26", default-features = false, features = ["fs", "poll"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
